start_1: >
  🎵 Welcome to HEPSİ BURADA MÜZİK BOTU!

  I am a fast and high quality Telegram music bot.

  Add me to your group and start a voice chat.

  Use /play to play music instantly.

  Enjoy nonstop music experience.

help_1: >
  🎧 HEPSİ BURADA MÜZİK BOTU Commands:

  /play <song name> - Play a song
  /pause - Pause playback
  /resume - Resume playback
  /skip - Skip current track
  /stop - Stop music
  /queue - Show queue
  /ping - Check bot status
  /help - Show this help message

about_1: >
  HEPSİ BURADA MÜZİK BOTU is a powerful Telegram voice chat music bot.

  It supports high quality streaming from multiple platforms.

  Fast, stable and 24/7 online.

  Developed for large groups and nonstop entertainment.
